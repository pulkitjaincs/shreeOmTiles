name: dhraERP Store Hours Keep-Alive

on:
  schedule:
    # 02:58 UTC = 08:28 AM IST: Pre-warm container & database 2 mins before business starts
    - cron: '58 2 * * *'
    # Every 10 mins from 03:00 to 17:50 UTC = 08:30 AM to 11:20 PM IST
    - cron: '*/10 3-17 * * *'
    # 18:00 UTC = 11:30 PM IST: Final ping of the business day (stays alive until ~11:45 PM IST)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to dhraERP Backend
        run: |
          TARGET_URL="${{ secrets.BACKEND_API_URL || 'https://dhraerp-backend.onrender.com' }}"
          echo "Sending keep-alive ping to $TARGET_URL at $(date -u)"
          curl -s -f -m 30 "$TARGET_URL/health?prewarm=true" || echo "Ping dispatched (server waking up if cold)"
