name: dhraERP Store Hours Keep-Alive

on:
  schedule:
    # 02:58 UTC = 08:28 AM IST: Pre-warm container & database 2 mins before showroom opens
    - cron: '58 2 * * *'
    # Every 10 mins from 03:00 to 17:30 UTC = 08:30 AM to 11:00 PM IST (Showroom business hours)
    - cron: '*/10 3-17 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to dhraERP Backend
        run: |
          TARGET_URL="${{ secrets.BACKEND_API_URL || 'https://dhraerp-backend.onrender.com' }}"
          echo "Sending keep-alive ping to $TARGET_URL at $(date -u)"
          curl -s -f -m 30 "$TARGET_URL/health" || echo "Ping dispatched (server waking up if cold)"
